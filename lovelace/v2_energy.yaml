title: Energy
icon: mdi:solar-power
panel: true
cards:
  - type: vertical-stack
    cards:

      # ════════════════════════════════════════════════════════════
      #  STATUS CHIPS — live power + billing at a glance
      # ════════════════════════════════════════════════════════════
      - type: custom:mushroom-chips-card
        alignment: center
        chips:
          - type: template
            icon: mdi:solar-power-variant
            icon_color: yellow
            content: "Solar {{ states('sensor.solar_power') }} kW"
          - type: template
            icon: mdi:transmission-tower
            icon_color: orange
            content: "Grid {{ states('sensor.grid_power') }} kW"
          - type: template
            icon: mdi:battery
            icon_color: >-
              {% set pct = states('sensor.home_energy_gateway_charge') | float(0) %}
              {% if pct > 50 %}green{% elif pct > 20 %}orange{% else %}red{% endif %}
            content: "Battery {{ states('sensor.powerwall_power_name') }}"
          - type: template
            icon: mdi:home-lightning-bolt
            icon_color: red
            content: "Load {{ states('sensor.house_load') }} kW"
          - type: template
            icon: mdi:currency-usd
            icon_color: green
            content: >-
              Bill ${{ states('sensor.current_bill_electric_cost_to_date') | default('--') }}
          - type: template
            icon: mdi:chart-timeline-variant
            icon_color: blue
            content: >-
              Forecast ${{ states('sensor.current_bill_electric_forecasted_cost') | default('--') }}

      # ════════════════════════════════════════════════════════════
      #  HERO ROW — Energy Flow + Power Bars
      # ════════════════════════════════════════════════════════════
      - type: horizontal-stack
        cards:
          # ── Energy Distribution (centerpiece) ──
          - type: vertical-stack
            cards:
              - type: energy-date-selection
              - type: energy-distribution
                card_mod:
                  style: |
                    ha-card {
                      border-radius: 16px !important;
                      border: 1px solid rgba(255,255,255,0.06) !important;
                    }

          # ── Live Power Bars + Gauges ──
          - type: vertical-stack
            cards:
              - type: "custom:config-template-card"
                entities:
                  - sensor.solar_power
                  - sensor.grid_power
                  - sensor.grid_power_target
                  - sensor.powerwall_power
                  - sensor.powerwall_power_target
                  - sensor.powerwall_power_name
                  - sensor.house_load
                card:
                  type: custom:bar-card
                  columns: 4
                  height: 140px
                  width: 95%
                  decimal: 1
                  direction: up
                  positions:
                    icon: inside
                    name: 'off'
                    value: outside
                    indicator: 'off'
                  animation:
                    state: 'on'
                    speed: 5
                  card_mod:
                    style: |
                      ha-card {
                        border-radius: 16px !important;
                        border: 1px solid rgba(255,255,255,0.06) !important;
                      }
                  entities:
                    - entity: sensor.solar_power
                      name: "Solar"
                      target: "${states['sensor.solar_power'].state}"
                      min: 0
                      max: 8
                      icon: mdi:solar-power-variant
                      severity:
                        - color: '#eab308'
                          from: 0
                          to: 8
                    - entity: sensor.grid_power
                      name: "Grid"
                      target: "${states['sensor.grid_power_target'].state}"
                      min: 0
                      max: 8
                      icon: mdi:transmission-tower
                      severity:
                        - color: '#f97316'
                          from: 0
                          to: 8
                    - entity: sensor.powerwall_power
                      name: "${states['sensor.powerwall_power_name'].state}"
                      target: "${states['sensor.powerwall_power_target'].state}"
                      min: 0
                      max: 8
                      icon: mdi:battery-charging
                      severity:
                        - color: '#22c55e'
                          from: 0
                          to: 8
                      positions:
                        name: inside
                    - entity: sensor.house_load
                      name: "Load"
                      target: "${states['sensor.house_load'].state}"
                      min: 0
                      max: 8
                      icon: mdi:home-lightning-bolt
                      severity:
                        - color: '#ef4444'
                          from: 0
                          to: 8

              - type: horizontal-stack
                cards:
                  - type: energy-grid-neutrality-gauge
                    card_mod:
                      style: |
                        ha-card {
                          border-radius: 16px !important;
                          border: 1px solid rgba(255,255,255,0.06) !important;
                        }
                  - type: energy-self-sufficiency-gauge
                    card_mod:
                      style: |
                        ha-card {
                          border-radius: 16px !important;
                          border: 1px solid rgba(255,255,255,0.06) !important;
                        }

      # ════════════════════════════════════════════════════════════
      #  PRODUCTION & CONSUMPTION GRAPHS
      # ════════════════════════════════════════════════════════════
      - type: horizontal-stack
        cards:
          - type: energy-solar-graph
            title: Solar Production
            card_mod:
              style: |
                ha-card {
                  border-radius: 16px !important;
                  border: 1px solid rgba(255,255,255,0.06) !important;
                }
          - type: energy-usage-graph
            title: Home Consumption
            card_mod:
              style: |
                ha-card {
                  border-radius: 16px !important;
                  border: 1px solid rgba(255,255,255,0.06) !important;
                }

      # ════════════════════════════════════════════════════════════
      #  SOLAR FORECAST — today, tomorrow, peak
      # ════════════════════════════════════════════════════════════
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: 1fr 1fr 1fr
          grid-gap: 12px
          mediaquery:
            "(max-width: 800px)":
              grid-template-columns: 1fr
        cards:
          - type: custom:mushroom-template-card
            primary: "{{ states('sensor.energy_production_today') }} kWh"
            secondary: Solar Production Today
            icon: mdi:solar-power-variant
            icon_color: yellow
            layout: horizontal
            card_mod:
              style: |
                ha-card {
                  border-radius: 16px !important;
                  border: 1px solid rgba(255,255,255,0.06) !important;
                }
                mushroom-state-info {
                  --card-primary-font-size: 20px;
                  --card-primary-font-weight: 600;
                }

          - type: custom:mushroom-template-card
            primary: "{{ states('sensor.energy_production_tomorrow') }} kWh"
            secondary: Solar Forecast Tomorrow
            icon: mdi:weather-sunny
            icon_color: orange
            layout: horizontal
            card_mod:
              style: |
                ha-card {
                  border-radius: 16px !important;
                  border: 1px solid rgba(255,255,255,0.06) !important;
                }
                mushroom-state-info {
                  --card-primary-font-size: 20px;
                  --card-primary-font-weight: 600;
                }

          - type: custom:mushroom-template-card
            primary: "{{ states('sensor.power_highest_peak_time_today') }}"
            secondary: Peak Production Time
            icon: mdi:clock-alert
            icon_color: amber
            layout: horizontal
            card_mod:
              style: |
                ha-card {
                  border-radius: 16px !important;
                  border: 1px solid rgba(255,255,255,0.06) !important;
                }
                mushroom-state-info {
                  --card-primary-font-size: 20px;
                  --card-primary-font-weight: 600;
                }

      # ════════════════════════════════════════════════════════════
      #  BILLING — Electric + Gas usage & forecasts
      # ════════════════════════════════════════════════════════════
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: 1fr 1fr 1fr 1fr
          grid-gap: 12px
          mediaquery:
            "(max-width: 1000px)":
              grid-template-columns: 1fr 1fr
        cards:
          - type: custom:mushroom-entity-card
            entity: sensor.current_bill_electric_usage_to_date
            name: Electric Usage
            icon: mdi:flash
            icon_color: yellow
            layout: horizontal
            card_mod:
              style: |
                ha-card {
                  border-radius: 16px !important;
                  border: 1px solid rgba(255,255,255,0.06) !important;
                }

          - type: custom:mushroom-entity-card
            entity: sensor.current_bill_electric_forecasted_usage
            name: Electric Forecast
            icon: mdi:flash-outline
            icon_color: orange
            layout: horizontal
            card_mod:
              style: |
                ha-card {
                  border-radius: 16px !important;
                  border: 1px solid rgba(255,255,255,0.06) !important;
                }

          - type: custom:mushroom-entity-card
            entity: sensor.current_bill_gas_usage_to_date
            name: Gas Usage
            icon: mdi:fire
            icon_color: red
            layout: horizontal
            card_mod:
              style: |
                ha-card {
                  border-radius: 16px !important;
                  border: 1px solid rgba(255,255,255,0.06) !important;
                }

          - type: custom:mushroom-entity-card
            entity: sensor.current_bill_gas_forecasted_usage
            name: Gas Forecast
            icon: mdi:fire-circle
            icon_color: deep-orange
            layout: horizontal
            card_mod:
              style: |
                ha-card {
                  border-radius: 16px !important;
                  border: 1px solid rgba(255,255,255,0.06) !important;
                }

      # ════════════════════════════════════════════════════════════
      #  GRAFANA — full energy profile
      # ════════════════════════════════════════════════════════════
      - type: iframe
        url: https://grafana.ubhits.com/d/fe75d2wuk7hfka/energy-profile?orgId=1&timezone=browser&kiosk
        aspect_ratio: 55%
        card_mod:
          style: |
            ha-card {
              border-radius: 16px !important;
              border: 1px solid rgba(255,255,255,0.06) !important;
              overflow: hidden;
            }
