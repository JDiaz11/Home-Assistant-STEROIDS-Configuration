title: Infrastructure
icon: mdi:server-network
panel: true
cards:
  - type: vertical-stack
    cards:

      # ════════════════════════════════════════════════════════════
      #  STATUS CHIPS — server rack at a glance
      # ════════════════════════════════════════════════════════════
      - type: custom:mushroom-chips-card
        alignment: center
        chips:
          - type: template
            icon: mdi:nas
            icon_color: "{{ 'green' if is_state('sensor.ubhinas_status','good') else 'red' }}"
            content: UbhiNAS
            tap_action:
              action: more-info
              entity: sensor.ubhinas_status
          - type: template
            icon: mdi:nas
            icon_color: "{{ 'green' if is_state('sensor.plexnas_status','good') else 'red' }}"
            content: PlexNAS
            tap_action:
              action: more-info
              entity: sensor.plexnas_status
          - type: template
            icon: mdi:server
            icon_color: "{{ 'green' if is_state('switch.homelab_server_pdu_outlet_2','on') else 'grey' }}"
            content: HP DL380
          - type: template
            icon: mdi:server
            icon_color: "{{ 'green' if is_state('switch.homelab_server_pdu_outlet_3','on') else 'grey' }}"
            content: SM-01
          - type: template
            icon: mdi:server
            icon_color: "{{ 'green' if is_state('switch.homelab_server_pdu_outlet_4','on') else 'grey' }}"
            content: SM-02
          - type: template
            icon: mdi:cctv
            icon_color: "{{ 'green' if is_state('switch.homelab_server_pdu_outlet_8','on') else 'red' }}"
            content: NVR
          - type: template
            icon: mdi:flash
            icon_color: yellow
            content: "{{ states('sensor.homelab_server_pdu_load') }}A draw"

      # ════════════════════════════════════════════════════════════
      #  PDU POWER CONTROLS — rack power management
      # ════════════════════════════════════════════════════════════
      - type: custom:mushroom-title-card
        title: HomeLab Power
        subtitle: "Total rack draw: {{ states('sensor.homelab_server_pdu_load') }} A"

      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: repeat(4, 1fr)
          grid-gap: 10px
          mediaquery:
            "(max-width: 1000px)":
              grid-template-columns: repeat(3, 1fr)
            "(max-width: 600px)":
              grid-template-columns: 1fr 1fr
        cards:
          - type: custom:mushroom-entity-card
            entity: switch.homelab_server_pdu_outlet_1
            name: Network Switch
            icon: mdi:router-network-wireless
            tap_action:
              action: toggle
              confirmation:
                text: "Toggle power for HomeLab Network Switch?"
            layout: vertical
            card_mod: &infra_card
              style: |
                ha-card {
                  border-radius: 16px !important;
                  border: 1px solid rgba(255,255,255,0.06) !important;
                }

          - type: custom:mushroom-entity-card
            entity: switch.homelab_server_pdu_outlet_2
            name: HP DL380 G9
            icon: mdi:server
            tap_action:
              action: toggle
              confirmation:
                text: "Toggle power for HP DL380 G9?"
            layout: vertical
            card_mod: *infra_card

          - type: custom:mushroom-entity-card
            entity: switch.homelab_server_pdu_outlet_3
            name: SuperMicro 01
            icon: mdi:server
            tap_action:
              action: toggle
              confirmation:
                text: "Toggle power for SuperMicro 01?"
            layout: vertical
            card_mod: *infra_card

          - type: custom:mushroom-entity-card
            entity: switch.homelab_server_pdu_outlet_4
            name: SuperMicro 02
            icon: mdi:server
            tap_action:
              action: toggle
              confirmation:
                text: "Toggle power for SuperMicro 02?"
            layout: vertical
            card_mod: *infra_card

          - type: custom:mushroom-entity-card
            entity: switch.homelab_server_pdu_outlet_5
            name: Rack Monitor
            icon: mdi:monitor
            tap_action:
              action: toggle
              confirmation:
                text: "Toggle power for Rack Monitor?"
            layout: vertical
            card_mod: *infra_card

          - type: custom:mushroom-entity-card
            entity: switch.homelab_server_pdu_outlet_6
            name: PlexNAS
            icon: mdi:nas
            tap_action:
              action: toggle
              confirmation:
                text: "Toggle power for PlexNAS?"
            layout: vertical
            card_mod: *infra_card

          - type: custom:mushroom-entity-card
            entity: switch.homelab_server_pdu_outlet_7
            name: ThorNAS
            icon: mdi:nas
            tap_action:
              action: toggle
              confirmation:
                text: "Toggle power for ThorNAS?"
            layout: vertical
            card_mod: *infra_card

          - type: custom:mushroom-entity-card
            entity: switch.homelab_server_pdu_outlet_8
            name: NVR
            icon: mdi:cctv
            tap_action:
              action: toggle
              confirmation:
                text: "Toggle power for the NVR?"
            layout: vertical
            card_mod: *infra_card

      # ════════════════════════════════════════════════════════════
      #  HP DL380 — conditional details
      # ════════════════════════════════════════════════════════════
      - type: conditional
        conditions:
          - condition: state
            entity: switch.homelab_server_pdu_outlet_2
            state: "on"
        card:
          type: vertical-stack
          cards:
            - type: custom:mushroom-title-card
              title: HP DL380 G9
              subtitle: Titan AI Server

            - type: custom:layout-card
              layout_type: custom:grid-layout
              layout:
                grid-template-columns: 1fr 1fr 1fr
                grid-gap: 10px
              cards:
                - type: custom:mushroom-entity-card
                  entity: sensor.hp_ilo_power_status
                  name: Power State
                  icon: mdi:power
                  layout: horizontal
                  card_mod: *infra_card
                - type: custom:mushroom-entity-card
                  entity: sensor.hp_ilo_power_reading
                  name: Power Draw
                  icon: mdi:flash
                  layout: horizontal
                  card_mod: *infra_card
                - type: button
                  icon: mdi:power-cycle
                  name: iLO Toggle
                  tap_action:
                    action: call-service
                    service: rest_command.hp_server_toggleonoff
                    confirmation:
                      text: "Toggle HP DL380 via iLO?"
                  card_mod: *infra_card

            - type: custom:mini-graph-card
              name: HP DL380 Power Draw
              unit: W
              icon: mdi:server
              hours_to_show: 1
              points_per_hour: 60
              update_interval: 60
              animate: true
              line_width: 1
              smoothing: false
              entities:
                - entity: sensor.hp_ilo_power_reading
                  color: '#f97316'
              show:
                graph: bar
              card_mod: *infra_card

            - type: custom:layout-card
              layout_type: custom:grid-layout
              layout:
                grid-template-columns: repeat(5, 1fr)
                grid-gap: 8px
                mediaquery:
                  "(max-width: 1000px)":
                    grid-template-columns: repeat(3, 1fr)
              cards:
                - type: custom:mushroom-entity-card
                  entity: sensor.hp_ilo_health_processor_status
                  name: CPU
                  icon: mdi:cpu-64-bit
                  layout: vertical
                  card_mod: *infra_card
                - type: custom:mushroom-entity-card
                  entity: sensor.hp_ilo_health_memory_status
                  name: Memory
                  icon: mdi:memory
                  layout: vertical
                  card_mod: *infra_card
                - type: custom:mushroom-entity-card
                  entity: sensor.hp_ilo_health_storage_status
                  name: Storage
                  icon: mdi:harddisk
                  layout: vertical
                  card_mod: *infra_card
                - type: custom:mushroom-entity-card
                  entity: sensor.hp_ilo_health_fan_status
                  name: Fans
                  icon: mdi:fan
                  layout: vertical
                  card_mod: *infra_card
                - type: custom:mushroom-entity-card
                  entity: sensor.hp_ilo_health_network_status
                  name: Network
                  icon: mdi:ethernet
                  layout: vertical
                  card_mod: *infra_card

            - type: custom:layout-card
              layout_type: custom:grid-layout
              layout:
                grid-template-columns: repeat(3, 1fr)
                grid-gap: 8px
              cards:
                - type: custom:mushroom-template-card
                  primary: "{{ states('sensor.hp_ilo_temp_inlet') }}°C"
                  secondary: Inlet Temp
                  icon: mdi:thermometer
                  icon_color: |-
                    {% set t = states('sensor.hp_ilo_temp_inlet') | float(0) %}
                    {% if t < 30 %}green{% elif t < 40 %}orange{% else %}red{% endif %}
                  layout: horizontal
                  card_mod: *infra_card
                - type: custom:mushroom-template-card
                  primary: "{{ states('sensor.hp_ilo_temp_cpu1') }}°C"
                  secondary: CPU 1
                  icon: mdi:cpu-64-bit
                  icon_color: |-
                    {% set t = states('sensor.hp_ilo_temp_cpu1') | float(0) %}
                    {% if t < 60 %}green{% elif t < 80 %}orange{% else %}red{% endif %}
                  layout: horizontal
                  card_mod: *infra_card
                - type: custom:mushroom-template-card
                  primary: "{{ states('sensor.hp_ilo_temp_cpu2') }}°C"
                  secondary: CPU 2
                  icon: mdi:cpu-64-bit
                  icon_color: |-
                    {% set t = states('sensor.hp_ilo_temp_cpu2') | float(0) %}
                    {% if t < 60 %}green{% elif t < 80 %}orange{% else %}red{% endif %}
                  layout: horizontal
                  card_mod: *infra_card

      # ════════════════════════════════════════════════════════════
      #  SUPERMICRO 01 — conditional details
      # ════════════════════════════════════════════════════════════
      - type: conditional
        conditions:
          - condition: state
            entity: switch.homelab_server_pdu_outlet_3
            state: "on"
        card:
          type: vertical-stack
          cards:
            - type: custom:mushroom-title-card
              title: SuperMicro 01
            - type: custom:layout-card
              layout_type: custom:grid-layout
              layout:
                grid-template-columns: repeat(3, 1fr)
                grid-gap: 10px
              cards:
                - type: custom:mushroom-entity-card
                  entity: sensor.supermicro_01_state
                  name: State
                  layout: horizontal
                  card_mod: *infra_card
                - type: custom:mushroom-template-card
                  primary: "{{ states('sensor.supermicro_01_cpu1_temp') }}°C"
                  secondary: CPU 1
                  icon: mdi:cpu-64-bit
                  icon_color: |-
                    {% set t = states('sensor.supermicro_01_cpu1_temp') | float(0) %}
                    {% if t < 60 %}green{% elif t < 80 %}orange{% else %}red{% endif %}
                  layout: horizontal
                  card_mod: *infra_card
                - type: custom:mushroom-template-card
                  primary: "{{ states('sensor.supermicro_01_cpu2_temp') }}°C"
                  secondary: CPU 2
                  icon: mdi:cpu-64-bit
                  icon_color: |-
                    {% set t = states('sensor.supermicro_01_cpu2_temp') | float(0) %}
                    {% if t < 60 %}green{% elif t < 80 %}orange{% else %}red{% endif %}
                  layout: horizontal
                  card_mod: *infra_card
            - type: custom:layout-card
              layout_type: custom:grid-layout
              layout:
                grid-template-columns: repeat(4, 1fr)
                grid-gap: 8px
              cards:
                - type: custom:mushroom-entity-card
                  entity: switch.supermicro_01_server_chassis
                  name: Chassis
                  layout: vertical
                  card_mod: *infra_card
                - type: custom:mushroom-entity-card
                  entity: sensor.supermicro_01_system_temp
                  name: System
                  layout: vertical
                  card_mod: *infra_card
                - type: custom:mushroom-entity-card
                  entity: sensor.supermicro_01_pch_temp
                  name: PCH
                  layout: vertical
                  card_mod: *infra_card
                - type: custom:mushroom-entity-card
                  entity: sensor.supermicro_01_peripheral_temp
                  name: Peripheral
                  layout: vertical
                  card_mod: *infra_card

      # ════════════════════════════════════════════════════════════
      #  SUPERMICRO 02 — conditional details
      # ════════════════════════════════════════════════════════════
      - type: conditional
        conditions:
          - condition: state
            entity: switch.homelab_server_pdu_outlet_4
            state: "on"
        card:
          type: vertical-stack
          cards:
            - type: custom:mushroom-title-card
              title: SuperMicro 02
            - type: custom:layout-card
              layout_type: custom:grid-layout
              layout:
                grid-template-columns: repeat(3, 1fr)
                grid-gap: 10px
              cards:
                - type: custom:mushroom-entity-card
                  entity: sensor.supermicro_02_state
                  name: State
                  layout: horizontal
                  card_mod: *infra_card
                - type: custom:mushroom-template-card
                  primary: "{{ states('sensor.supermicro_02_cpu1_temp') }}°C"
                  secondary: CPU 1
                  icon: mdi:cpu-64-bit
                  icon_color: |-
                    {% set t = states('sensor.supermicro_02_cpu1_temp') | float(0) %}
                    {% if t < 60 %}green{% elif t < 80 %}orange{% else %}red{% endif %}
                  layout: horizontal
                  card_mod: *infra_card
                - type: custom:mushroom-template-card
                  primary: "{{ states('sensor.supermicro_02_cpu2_temp') }}°C"
                  secondary: CPU 2
                  icon: mdi:cpu-64-bit
                  icon_color: |-
                    {% set t = states('sensor.supermicro_02_cpu2_temp') | float(0) %}
                    {% if t < 60 %}green{% elif t < 80 %}orange{% else %}red{% endif %}
                  layout: horizontal
                  card_mod: *infra_card
            - type: custom:layout-card
              layout_type: custom:grid-layout
              layout:
                grid-template-columns: repeat(4, 1fr)
                grid-gap: 8px
              cards:
                - type: custom:mushroom-entity-card
                  entity: switch.supermicro_02_server_chassis
                  name: Chassis
                  layout: vertical
                  card_mod: *infra_card
                - type: custom:mushroom-entity-card
                  entity: sensor.supermicro_02_system_temp
                  name: System
                  layout: vertical
                  card_mod: *infra_card
                - type: custom:mushroom-entity-card
                  entity: sensor.supermicro_02_pch_temp
                  name: PCH
                  layout: vertical
                  card_mod: *infra_card
                - type: custom:mushroom-entity-card
                  entity: sensor.supermicro_02_peripheral_temp
                  name: Peripheral
                  layout: vertical
                  card_mod: *infra_card

      # ════════════════════════════════════════════════════════════
      #  NAS HEALTH — Grafana
      # ════════════════════════════════════════════════════════════
      - type: custom:mushroom-title-card
        title: NAS Health
        subtitle: Grafana Dashboard

      - type: iframe
        url: https://grafana.ubhits.com/d/ae751mokonhfkf/nas-status?orgId=1&timezone=browser&kiosk
        aspect_ratio: 60%
        card_mod:
          style: |
            ha-card {
              border-radius: 16px !important;
              border: 1px solid rgba(255,255,255,0.06) !important;
              overflow: hidden;
            }

      # ════════════════════════════════════════════════════════════
      #  HA SYSTEM MONITOR
      # ════════════════════════════════════════════════════════════
      - type: custom:mushroom-title-card
        title: Home Assistant
        subtitle: System Resources

      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: repeat(3, 1fr)
          grid-gap: 10px
          mediaquery:
            "(max-width: 600px)":
              grid-template-columns: 1fr 1fr
        cards:
          - type: custom:mushroom-template-card
            primary: "{{ states('sensor.processor_use') }}%"
            secondary: CPU Usage
            icon: mdi:cpu-64-bit
            icon_color: |-
              {% set u = states('sensor.processor_use') | float(0) %}
              {% if u < 50 %}green{% elif u < 80 %}orange{% else %}red{% endif %}
            layout: horizontal
            card_mod: *infra_card

          - type: custom:mushroom-template-card
            primary: "{{ states('sensor.memory_use_percent') }}%"
            secondary: Memory
            icon: mdi:memory
            icon_color: |-
              {% set u = states('sensor.memory_use_percent') | float(0) %}
              {% if u < 60 %}green{% elif u < 85 %}orange{% else %}red{% endif %}
            layout: horizontal
            card_mod: *infra_card

          - type: custom:mushroom-entity-card
            entity: sensor.disk_free
            name: Disk Free
            icon: mdi:harddisk
            layout: horizontal
            card_mod: *infra_card

          - type: custom:mushroom-entity-card
            entity: sensor.load_1m
            name: Load 1m
            icon: mdi:gauge
            layout: horizontal
            card_mod: *infra_card

          - type: custom:mushroom-entity-card
            entity: sensor.load_5m
            name: Load 5m
            icon: mdi:gauge
            layout: horizontal
            card_mod: *infra_card

          - type: custom:mushroom-template-card
            primary: "{{ states('sensor.swap_use_percent') }}%"
            secondary: Swap
            icon: mdi:swap-horizontal
            icon_color: |-
              {% set u = states('sensor.swap_use_percent') | float(0) %}
              {% if u < 30 %}green{% elif u < 70 %}orange{% else %}red{% endif %}
            layout: horizontal
            card_mod: *infra_card
