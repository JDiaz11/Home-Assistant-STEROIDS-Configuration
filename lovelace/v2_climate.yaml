                  --icon-color: {% if t < 65 %}var(--blue-color){% elif t < 73 %}var(--green-color){% elif t < 77 %}var(--orange-color){% else %}var(--red-color){% endif %} !important;
                  --shape-color: {% if t < 65 %}rgba(var(--rgb-blue-color),0.2){% elif t < 73 %}rgba(var(--rgb-green-color),0.2){% elif t < 77 %}rgba(var(--rgb-orange-color),0.2){% else %}rgba(var(--rgb-red-color),0.2){% endif %} !important;
                }

          - type: custom:mushroom-climate-card
            entity: climate.thermostat_entertainment_room
            show_temperature_control: true
            collapsible_controls: false
            name: Entertainment Room
            icon: mdi:television
            card_mod:
              style: |
                ha-card {
                  border-radius: 16px !important;
                  border: 1px solid rgba(255,255,255,0.06) !important;
                }
                mushroom-shape-icon {
                  {% set t = state_attr('climate.thermostat_entertainment_room','current_temperature') | float(0) %}
                  --icon-color: {% if t < 65 %}var(--blue-color){% elif t < 73 %}var(--green-color){% elif t < 77 %}var(--orange-color){% else %}var(--red-color){% endif %} !important;
                  --shape-color: {% if t < 65 %}rgba(var(--rgb-blue-color),0.2){% elif t < 73 %}rgba(var(--rgb-green-color),0.2){% elif t < 77 %}rgba(var(--rgb-orange-color),0.2){% else %}rgba(var(--rgb-red-color),0.2){% endif %} !important;
                }

          - type: custom:mushroom-climate-card
            entity: climate.thermostat_upper_big_bedroom
            show_temperature_control: true
            collapsible_controls: false
            name: Upper Big Bedroom
            icon: mdi:bed
            card_mod:
              style: |
                ha-card {
                  border-radius: 16px !important;
                  border: 1px solid rgba(255,255,255,0.06) !important;
                }
                mushroom-shape-icon {
                  {% set t = state_attr('climate.thermostat_upper_big_bedroom','current_temperature') | float(0) %}
                  --icon-color: {% if t < 65 %}var(--blue-color){% elif t < 73 %}var(--green-color){% elif t < 77 %}var(--orange-color){% else %}var(--red-color){% endif %} !important;
                  --shape-color: {% if t < 65 %}rgba(var(--rgb-blue-color),0.2){% elif t < 73 %}rgba(var(--rgb-green-color),0.2){% elif t < 77 %}rgba(var(--rgb-orange-color),0.2){% else %}rgba(var(--rgb-red-color),0.2){% endif %} !important;
                }

          - type: custom:mushroom-climate-card
            entity: climate.thermostat_upper_small_bedroom
            show_temperature_control: true
            collapsible_controls: false
            name: Upper Small Bedroom
            icon: mdi:bed
            card_mod:
              style: |
                ha-card {
                  border-radius: 16px !important;
                  border: 1px solid rgba(255,255,255,0.06) !important;
                }
                mushroom-shape-icon {
                  {% set t = state_attr('climate.thermostat_upper_small_bedroom','current_temperature') | float(0) %}
                  --icon-color: {% if t < 65 %}var(--blue-color){% elif t < 73 %}var(--green-color){% elif t < 77 %}var(--orange-color){% else %}var(--red-color){% endif %} !important;
                  --shape-color: {% if t < 65 %}rgba(var(--rgb-blue-color),0.2){% elif t < 73 %}rgba(var(--rgb-green-color),0.2){% elif t < 77 %}rgba(var(--rgb-orange-color),0.2){% else %}rgba(var(--rgb-red-color),0.2){% endif %} !important;
                }

          - type: custom:mushroom-climate-card
            entity: climate.thermostat_upper_guest_bedroom
            show_temperature_control: true
            collapsible_controls: false
            name: Upper Guest Bedroom
            icon: mdi:bed-outline
            card_mod:
              style: |
                ha-card {
                  border-radius: 16px !important;
                  border: 1px solid rgba(255,255,255,0.06) !important;
                }
                mushroom-shape-icon {
                  {% set t = state_attr('climate.thermostat_upper_guest_bedroom','current_temperature') | float(0) %}
                  --icon-color: {% if t < 65 %}var(--blue-color){% elif t < 73 %}var(--green-color){% elif t < 77 %}var(--orange-color){% else %}var(--red-color){% endif %} !important;
                  --shape-color: {% if t < 65 %}rgba(var(--rgb-blue-color),0.2){% elif t < 73 %}rgba(var(--rgb-green-color),0.2){% elif t < 77 %}rgba(var(--rgb-orange-color),0.2){% else %}rgba(var(--rgb-red-color),0.2){% endif %} !important;
                }

          - type: custom:mushroom-climate-card
            entity: climate.thermostat_attic
            show_temperature_control: true
            collapsible_controls: false
            name: Attic
