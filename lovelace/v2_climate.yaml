                  border: 1px solid rgba(255,255,255,0.06) !important;
                }
                mushroom-shape-icon {
                  {% set t = state_attr('climate.thermostat_attic','current_temperature') | float(0) %}
                  --icon-color: {% if t < 65 %}var(--blue-color){% elif t < 73 %}var(--green-color){% elif t < 77 %}var(--orange-color){% else %}var(--red-color){% endif %} !important;
                  --shape-color: {% if t < 65 %}rgba(var(--rgb-blue-color),0.2){% elif t < 73 %}rgba(var(--rgb-green-color),0.2){% elif t < 77 %}rgba(var(--rgb-orange-color),0.2){% else %}rgba(var(--rgb-red-color),0.2){% endif %} !important;
                }

      # ════════════════════════════════════════════════════════════
      #  TEMPERATURE TRENDS — 24h comparison
      # ════════════════════════════════════════════════════════════
      - type: custom:mini-graph-card
        name: Temperature Trends (24h)
        icon: mdi:chart-line
        hours_to_show: 24
        points_per_hour: 2
        line_width: 2
        animate: true
        show:
          legend: true
          fill: false
          labels: true
        entities:
          - entity: climate.thermostat_living_room
            attribute: current_temperature
            name: Living Room
            color: '#38bdf8'
          - entity: climate.thermostat_master_bedroom
            attribute: current_temperature
            name: Master BR
            color: '#fb923c'
          - entity: climate.thermostat_entertainment_room
            attribute: current_temperature
            name: Entertainment
            color: '#c084fc'
          - entity: climate.thermostat_upper_big_bedroom
            attribute: current_temperature
            name: Upper Big BR
            color: '#f87171'
          - entity: climate.thermostat_upper_small_bedroom
            attribute: current_temperature
            name: Upper Small BR
            color: '#4ade80'
          - entity: climate.thermostat_upper_guest_bedroom
            attribute: current_temperature
            name: Guest BR
            color: '#fbbf24'
          - entity: climate.thermostat_attic
            attribute: current_temperature
            name: Attic
            color: '#f97316'
        card_mod:
          style: |
            ha-card {
              border-radius: 16px !important;
              border: 1px solid rgba(255,255,255,0.06) !important;
            }

      # ════════════════════════════════════════════════════════════
      #  HUMIDITY TRENDS — 24h comparison
      # ════════════════════════════════════════════════════════════
      - type: custom:mini-graph-card
        name: Humidity Trends (24h)
        icon: mdi:water-percent
        hours_to_show: 24
        points_per_hour: 2
        line_width: 2
        animate: true
        show:
          legend: true
          fill: false
          labels: true
        entities:
          - entity: sensor.thermostat_living_room_humidity
            name: Living Room
            color: '#38bdf8'
          - entity: sensor.thermostat_master_bedroom_humidity
            name: Master BR
            color: '#fb923c'
          - entity: sensor.thermostat_entertainment_room_humidity
            name: Entertainment
            color: '#c084fc'
          - entity: sensor.thermostat_upper_big_bedroom_humidity
            name: Upper Big BR
            color: '#f87171'
          - entity: sensor.thermostat_upper_small_bedroom_humidity
            name: Upper Small BR
            color: '#4ade80'
          - entity: sensor.thermostat_upper_guest_bedroom_humidity
