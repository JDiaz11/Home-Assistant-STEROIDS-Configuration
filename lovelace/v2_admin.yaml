title: Admin
icon: mdi:wrench
panel: true
cards:
  - type: vertical-stack
    cards:

      # ════════════════════════════════════════════════════════════
      #  PEOPLE
      # ════════════════════════════════════════════════════════════
      - type: custom:mushroom-title-card
        title: People

      - type: horizontal-stack
        cards:
          - type: custom:mushroom-entity-card
            entity: device_tracker.funky_monkey_s_iphone
            layout: horizontal
            card_mod: &admin_card
              style: |
                ha-card {
                  border-radius: 16px !important;
                  border: 1px solid rgba(255,255,255,0.06) !important;
                }
          - type: custom:mushroom-entity-card
            entity: device_tracker.ivavvays_iphone
            layout: horizontal
            card_mod: *admin_card

      # ════════════════════════════════════════════════════════════
      #  ENERGY & SOLAR RAW DATA
      # ════════════════════════════════════════════════════════════
      - type: horizontal-stack
        cards:
          - type: custom:auto-entities
            card:
              type: entities
              state_color: true
              title: Solar Forecast
              show_header_toggle: false
              card_mod: *admin_card
            filter:
              include:
                - group: group.solar_forecast

          - type: custom:auto-entities
            card:
              type: entities
              state_color: true
              title: Home Energy
              show_header_toggle: false
              card_mod: *admin_card
            filter:
              include:
                - group: group.home_energy

          - type: custom:auto-entities
            card:
              type: entities
              state_color: true
              title: Water (ACWD)
              show_header_toggle: false
              card_mod: *admin_card
            filter:
              include:
                - group: group.home_water

      # ════════════════════════════════════════════════════════════
      #  ROOMS — entity debug (2-column layout)
      # ════════════════════════════════════════════════════════════
      - type: custom:mushroom-title-card
        title: Room Entities
        subtitle: Debug view

      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: 1fr 1fr
          grid-gap: 10px
          mediaquery:
            "(max-width: 800px)":
              grid-template-columns: 1fr
        cards:
          - type: custom:auto-entities
            card:
              type: entities
              state_color: true
              title: Living Room
              show_header_toggle: false
              card_mod: *admin_card
            filter:
              include:
                - group: group.living_room

          - type: custom:auto-entities
            card:
              type: entities
              state_color: true
              title: Kitchen
              show_header_toggle: false
              card_mod: *admin_card
            filter:
              include:
                - group: group.kitchen

          - type: custom:auto-entities
