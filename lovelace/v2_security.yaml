title: Security
icon: mdi:shield-home
panel: true
cards:
  - type: vertical-stack
    cards:

      # ════════════════════════════════════════════════════════════
      #  STATUS CHIPS — security overview
      # ════════════════════════════════════════════════════════════
      - type: custom:mushroom-chips-card
        alignment: center
        chips:
          - type: template
            icon: mdi:door
            icon_color: |-
              {% set open = states.binary_sensor
                | selectattr('attributes.device_class','defined')
                | selectattr('attributes.device_class','eq','door')
                | selectattr('state','eq','on') | list | count %}
              {{ 'red' if open > 0 else 'green' }}
            content: >-
              {% set open = states.binary_sensor
                | selectattr('attributes.device_class','defined')
                | selectattr('attributes.device_class','eq','door')
                | selectattr('state','eq','on') | list | count %}
              {{ open }} door{{ 's' if open != 1 }} open
          - type: template
            icon: mdi:window-open-variant
            icon_color: |-
              {% set open = states.binary_sensor
                | selectattr('attributes.device_class','defined')
                | selectattr('attributes.device_class','eq','window')
                | selectattr('state','eq','on') | list | count %}
              {{ 'orange' if open > 0 else 'green' }}
            content: >-
              {% set open = states.binary_sensor
                | selectattr('attributes.device_class','defined')
                | selectattr('attributes.device_class','eq','window')
                | selectattr('state','eq','on') | list | count %}
              {{ open }} window{{ 's' if open != 1 }} open
          - type: template
            icon: mdi:garage-variant
            icon_color: |-
              {% set open = states.cover
                | selectattr('state','eq','open') | list | count %}
              {{ 'red' if open > 0 else 'green' }}
            content: >-
              {% set open = states.cover
                | selectattr('state','eq','open') | list | count %}
              Garage {{ 'OPEN' if open > 0 else 'Closed' }}
          - type: template
            icon: mdi:cctv
            icon_color: |-
              {{ 'green' if is_state('switch.homelab_server_pdu_outlet_8','on') else 'red' }}
            content: >-
              NVR {{ 'Online' if is_state('switch.homelab_server_pdu_outlet_8','on') else 'OFFLINE' }}

      # ════════════════════════════════════════════════════════════
      #  GARAGE + SECURITY STATUS
      # ════════════════════════════════════════════════════════════
      - type: horizontal-stack
        cards:
          - type: custom:mushroom-cover-card
            entity: cover.garage_door_big
            name: Garage Door Big
            icon: mdi:garage
            show_buttons_control: true
            show_position_control: false
            layout: horizontal
          - type: custom:mushroom-cover-card
            entity: cover.garage_door_small
            name: Garage Door Small
            icon: mdi:garage-variant
            show_buttons_control: true
            show_position_control: false
            layout: horizontal

      # ── All Secure (shows when nothing is open) ──
      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.main_door
            state: "off"
          - condition: state
            entity: binary_sensor.kitchen_door
            state: "off"
          - condition: state
            entity: binary_sensor.garage_laundry_door
            state: "off"
          - condition: state
            entity: cover.garage_door_big
            state: "closed"
          - condition: state
            entity: cover.garage_door_small
            state: "closed"
        card:
          type: custom:mushroom-template-card
          primary: All Secure
          secondary: All entry points closed
          icon: mdi:shield-check
          icon_color: green
          layout: horizontal

      # ── Currently Open Items (hidden when empty) ──
      - type: custom:auto-entities
        card:
          type: entities
          title: Currently Open
          show_header_toggle: false
        show_empty: false
        sort:
          method: state
          reverse: true
        filter:
          include:
            - domain: binary_sensor
              attributes:
                device_class: door
              state: "on"
            - domain: binary_sensor
              attributes:
                device_class: window
              state: "on"
          exclude:
            - entity_id: "*_door_state"
            - entity_id: "*_window_state"
            - entity_id: "*_state_of_*"
            - domain: cover
              state: open

      # ════════════════════════════════════════════════════════════
      #  CAMERAS — hero grid
      # ════════════════════════════════════════════════════════════
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: 1fr 1fr 1fr
          grid-gap: 8px
          mediaquery:
            "(max-width: 1000px)":
              grid-template-columns: 1fr 1fr
            "(max-width: 600px)":
              grid-template-columns: 1fr
        cards:
          - type: picture-glance
            title: Main Door
            camera_image: camera.main_door_camera
            camera_view: auto
            entities:
              - binary_sensor.main_door
              - light.living_room_light
            card_mod:
              style: |
                ha-card { border-radius: 16px !important; overflow: hidden; border: 1px solid rgba(255,255,255,0.06) !important; }

          - type: picture-glance
            title: Living Room
            camera_image: camera.living_room_camera
            camera_view: auto
            entities:
              - light.living_room_light
            card_mod:
