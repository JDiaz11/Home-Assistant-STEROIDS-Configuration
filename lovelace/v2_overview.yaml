title: Overview
icon: mdi:view-dashboard
panel: true
cards:
  - type: vertical-stack
    cards:

      # ════════════════════════════════════════════════════════════
      #  STATUS CHIP BAR — at-a-glance vitals across the top
      # ════════════════════════════════════════════════════════════
      - type: custom:mushroom-chips-card
        alignment: center
        chips:
          - type: weather
            entity: weather.openweathermap
            show_conditions: true
            show_temperature: true
          - type: template
            icon: mdi:solar-power-variant
            icon_color: yellow
            content: "{{ states('sensor.solar_power') }} kW"
            tap_action:
              action: navigate
              navigation_path: /lovelace-monitor/3
          - type: template
            icon: mdi:battery
            icon_color: >-
              {% set pct = states('sensor.home_energy_gateway_charge') | float(0) %}
              {% if pct > 50 %}green{% elif pct > 20 %}orange{% else %}red{% endif %}
            content: "{{ states('sensor.powerwall_power_name') }}"
            tap_action:
              action: navigate
              navigation_path: /lovelace-monitor/3
          - type: template
            icon: mdi:home-lightning-bolt
            icon_color: "{{ 'red' if states('sensor.house_load') | float(0) > 5 else 'deep-orange' }}"
            content: "{{ states('sensor.house_load') }} kW"
          - type: template
            icon: mdi:shield-home
            icon_color: |-
              {% set doors = states.binary_sensor
                | selectattr('attributes.device_class','defined')
                | selectattr('attributes.device_class','eq','door')
                | selectattr('state','eq','on') | list | count %}
              {% set wins = states.binary_sensor
                | selectattr('attributes.device_class','defined')
                | selectattr('attributes.device_class','eq','window')
                | selectattr('state','eq','on') | list | count %}
              {% set garage = states.cover | selectattr('state','eq','open') | list | count %}
              {{ 'red' if (doors + wins + garage) > 0 else 'green' }}
            content: >-
              {% set doors = states.binary_sensor
                | selectattr('attributes.device_class','defined')
                | selectattr('attributes.device_class','eq','door')
                | selectattr('state','eq','on') | list | count %}
              {% set wins = states.binary_sensor
                | selectattr('attributes.device_class','defined')
                | selectattr('attributes.device_class','eq','window')
                | selectattr('state','eq','on') | list | count %}
              {% set garage = states.cover | selectattr('state','eq','open') | list | count %}
              {% set total = doors + wins + garage %}
              {{ 'All Secure' if total == 0 else (total | string + ' open') }}
            tap_action:
              action: navigate
              navigation_path: /lovelace-monitor/4
          - type: template
            icon: mdi:account-group
            icon_color: >-
              {% set home = states.device_tracker | selectattr('state','eq','home') | list | count %}
              {{ 'green' if home > 0 else 'grey' }}
            content: >-
              {% set home = states.device_tracker | selectattr('state','eq','home') | list | count %}
              {{ home | string + ' home' if home > 0 else 'Nobody' }}
          - type: template
            icon: mdi:web
            icon_color: |-
              {% if states('sensor.xfinity_usage') | int(0) > states('sensor.data_allowance_till_date') | int(0) %}red
              {% else %}cyan{% endif %}
            content: "{{ states('sensor.xfinity_usage') | int(0) }} / 1229 GB"

      # ════════════════════════════════════════════════════════════
      #  CURRENTLY ACTIVE — pulsing strip of things that need attention
      # ════════════════════════════════════════════════════════════
      - type: custom:auto-entities
        card:
          type: glance
          show_state: false
          columns: 8
        show_empty: false
        filter:
          include:
            - domain: light
              state: "on"
            - domain: fan
              state: "on"
            - domain: switch
              state: "on"
            - domain: cover
              state: open
          exclude:
            - entity_id: "switch.homelab_*"
            - entity_id: "switch.supermicro_*"

      # ════════════════════════════════════════════════════════════
      #  HERO ROW — Weather | Energy Flow | Power Bars
      # ════════════════════════════════════════════════════════════
      - type: horizontal-stack
        cards:
          - type: custom:clock-weather-card
            entity: weather.openweathermap
            card_mod: &card_style
              style: |
                ha-card {
                  border-radius: 16px !important;
                  border: 1px solid rgba(255,255,255,0.06) !important;
                }

          - type: vertical-stack
            cards:
              - type: energy-date-selection
              - type: energy-distribution
                card_mod: *card_style

          - type: "custom:config-template-card"
            entities:
              - sensor.solar_power
              - sensor.grid_power
              - sensor.grid_power_target
              - sensor.powerwall_power
              - sensor.powerwall_power_target
              - sensor.powerwall_power_name
              - sensor.house_load
            card:
              type: custom:bar-card
              columns: 4
              height: 140px
              width: 95%
              decimal: 1
              direction: up
              positions:
                icon: inside
                name: 'off'
                value: outside
                indicator: 'off'
              animation:
                state: 'on'
                speed: 5
              card_mod: *card_style
              entities:
                - entity: sensor.solar_power
                  name: "Solar"
                  target: "${states['sensor.solar_power'].state}"
                  min: 0
                  max: 8
                  icon: mdi:solar-power-variant
                  severity:
                    - color: '#eab308'
                      from: 0
                      to: 8
                - entity: sensor.grid_power
                  name: "Grid"
                  target: "${states['sensor.grid_power_target'].state}"
                  min: 0
                  max: 8
                  icon: mdi:transmission-tower
                  severity:
                    - color: '#f97316'
                      from: 0
                      to: 8
                - entity: sensor.powerwall_power
                  name: "${states['sensor.powerwall_power_name'].state}"
                  target: "${states['sensor.powerwall_power_target'].state}"
                  min: 0
                  max: 8
                  icon: mdi:battery-charging
                  severity:
                    - color: '#22c55e'
                      from: 0
                      to: 8
                  positions:
                    name: inside
                - entity: sensor.house_load
                  name: "Load"
                  target: "${states['sensor.house_load'].state}"
                  min: 0
                  max: 8
                  icon: mdi:home-lightning-bolt
                  severity:
                    - color: '#ef4444'
                      from: 0
                      to: 8

      # ════════════════════════════════════════════════════════════
      #  ROOM TEMPERATURES — color-coded strip (the wow factor)
      # ════════════════════════════════════════════════════════════
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: repeat(7, 1fr)
          grid-gap: 8px
          margin: 0
          mediaquery:
            "(max-width: 1200px)":
              grid-template-columns: repeat(4, 1fr)
            "(max-width: 600px)":
              grid-template-columns: repeat(2, 1fr)
        cards:
          - type: custom:mushroom-template-card
            primary: >-
              {{ state_attr('climate.thermostat_master_bedroom','current_temperature') | float(0) | round(0) }}°F
            secondary: Master BR
            icon: mdi:bed-king
            icon_color: |-
              {% set t = state_attr('climate.thermostat_master_bedroom','current_temperature') | float(0) %}
              {% if t < 65 %}blue{% elif t < 73 %}green{% elif t < 77 %}orange{% else %}red{% endif %}
            layout: vertical
            tap_action:
              action: more-info
              entity: climate.thermostat_master_bedroom
            card_mod: &temp_card
              style: |
                ha-card {
                  border-radius: 16px !important;
                  border: 1px solid rgba(255,255,255,0.06) !important;
                }
                mushroom-state-info {
                  --card-primary-font-size: 22px;
                  --card-primary-font-weight: 600;
                }

          - type: custom:mushroom-template-card
            primary: >-
              {{ state_attr('climate.thermostat_living_room','current_temperature') | float(0) | round(0) }}°F
            secondary: Living Room
            icon: mdi:sofa
            icon_color: |-
              {% set t = state_attr('climate.thermostat_living_room','current_temperature') | float(0) %}
              {% if t < 65 %}blue{% elif t < 73 %}green{% elif t < 77 %}orange{% else %}red{% endif %}
            layout: vertical
            tap_action:
              action: more-info
              entity: climate.thermostat_living_room
            card_mod: *temp_card

          - type: custom:mushroom-template-card
            primary: >-
              {{ state_attr('climate.thermostat_entertainment_room','current_temperature') | float(0) | round(0) }}°F
            secondary: Entertainment
            icon: mdi:television
            icon_color: |-
              {% set t = state_attr('climate.thermostat_entertainment_room','current_temperature') | float(0) %}
              {% if t < 65 %}blue{% elif t < 73 %}green{% elif t < 77 %}orange{% else %}red{% endif %}
            layout: vertical
            tap_action:
              action: more-info
              entity: climate.thermostat_entertainment_room
            card_mod: *temp_card

          - type: custom:mushroom-template-card
            primary: >-
              {{ state_attr('climate.thermostat_upper_big_bedroom','current_temperature') | float(0) | round(0) }}°F
            secondary: Upper Big BR
            icon: mdi:bed
            icon_color: |-
              {% set t = state_attr('climate.thermostat_upper_big_bedroom','current_temperature') | float(0) %}
              {% if t < 65 %}blue{% elif t < 73 %}green{% elif t < 77 %}orange{% else %}red{% endif %}
            layout: vertical
            tap_action:
              action: more-info
              entity: climate.thermostat_upper_big_bedroom
            card_mod: *temp_card

          - type: custom:mushroom-template-card
            primary: >-
              {{ state_attr('climate.thermostat_upper_small_bedroom','current_temperature') | float(0) | round(0) }}°F
            secondary: Upper Small BR
            icon: mdi:bed
            icon_color: |-
              {% set t = state_attr('climate.thermostat_upper_small_bedroom','current_temperature') | float(0) %}
              {% if t < 65 %}blue{% elif t < 73 %}green{% elif t < 77 %}orange{% else %}red{% endif %}
            layout: vertical
            tap_action:
              action: more-info
              entity: climate.thermostat_upper_small_bedroom
            card_mod: *temp_card

          - type: custom:mushroom-template-card
            primary: >-
              {{ state_attr('climate.thermostat_upper_guest_bedroom','current_temperature') | float(0) | round(0) }}°F
            secondary: Guest BR
            icon: mdi:bed-outline
            icon_color: |-
              {% set t = state_attr('climate.thermostat_upper_guest_bedroom','current_temperature') | float(0) %}
              {% if t < 65 %}blue{% elif t < 73 %}green{% elif t < 77 %}orange{% else %}red{% endif %}
            layout: vertical
            tap_action:
              action: more-info
              entity: climate.thermostat_upper_guest_bedroom
            card_mod: *temp_card

          - type: custom:mushroom-template-card
            primary: >-
              {{ state_attr('climate.thermostat_attic','current_temperature') | float(0) | round(0) }}°F
            secondary: Attic
            icon: mdi:home-roof
            icon_color: |-
              {% set t = state_attr('climate.thermostat_attic','current_temperature') | float(0) %}
              {% if t < 65 %}blue{% elif t < 73 %}green{% elif t < 77 %}orange{% else %}red{% endif %}
            layout: vertical
            tap_action:
              action: more-info
              entity: climate.thermostat_attic
            card_mod: *temp_card

      # ════════════════════════════════════════════════════════════
      #  CALENDAR + HOME STATUS — calendar prominent, sidebar useful
      # ════════════════════════════════════════════════════════════
      # ── Calendar (full width, prominent) ──
      - type: custom:atomic-calendar
        enableModeChange: true
        defaultMode: 2
        entities:
          - entity: calendar.important_dates
            type: icon1
          - entity: calendar.birthdays
            type: icon2
          - entity: calendar.holidays_in_united_states
            type: holiday
        fullDayEventText: 'All Day'
        firstDayOfWeek: 0
        untilText: 'Until'
        showColors: true
        showDate: true
        showNoEventsForToday: true
        maxDaysToShow: 30
        showLocation: false
        showMonth: true
        showCurrentEventLine: false
        dateColor: '#94a3b8'
        dateSize: 90
        timeColor: '#60a5fa'
        timeSize: 90
        titleColor: '#e2e8f0'
        titleSize: 110
        locationIconColor: 'rgb(230, 124, 115)'
        locationLinkColor: '#94a3b8'
        locationTextSize: 90
        dimFinishedEvents: true
        finishedEventOpacity: 0.6
        finishedEventFilter: 'grayscale(100%)'
        dayWrapperLineColor: 'rgba(255,255,255,0.08)'
        eventBarColor: '#3b82f6'
        showProgressBar: false
        CalEventHolidayColor: '#c084fc'
        CalEventIcon1Color: '#22d3ee'
        CalEventIcon2Color: '#f87171'
        CalEventIcon3Color: '#4ade80'
        CalEventIcon1: mdi:home
        CalEventIcon2: mdi:gift
        CalEventIcon3: mdi:octagram
        card_mod: *card_style

      # ════════════════════════════════════════════════════════════
      #  WHO'S HOME + GARAGE + QUICK ACTIONS — single row
      # ════════════════════════════════════════════════════════════
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: 1fr 1fr 1fr
          grid-gap: 10px
          mediaquery:
            "(max-width: 800px)":
              grid-template-columns: 1fr
        cards:
          # People
          - type: vertical-stack
            cards:
              - type: custom:mushroom-title-card
                title: Who's Home
              - type: custom:mushroom-entity-card
                entity: device_tracker.funky_monkey_s_iphone
                layout: horizontal
                card_mod: *card_style
              - type: custom:mushroom-entity-card
                entity: device_tracker.ivavvays_iphone
                layout: horizontal
                card_mod: *card_style

          # Garage
          - type: vertical-stack
            cards:
              - type: custom:mushroom-title-card
                title: Garage
              - type: custom:mushroom-cover-card
                entity: cover.garage_door_big
                name: Big Garage
                icon: mdi:garage
                show_buttons_control: true
                show_position_control: false
                layout: horizontal
                card_mod: *card_style
              - type: custom:mushroom-cover-card
                entity: cover.garage_door_small
                name: Small Garage
                icon: mdi:garage-variant
                show_buttons_control: true
                show_position_control: false
                layout: horizontal
                card_mod: *card_style

          # Quick Actions + NAS
          - type: vertical-stack
            cards:
              - type: custom:mushroom-title-card
                title: Quick Actions
              - type: custom:layout-card
                layout_type: custom:grid-layout
                layout:
                  grid-template-columns: 1fr 1fr
                  grid-gap: 8px
                cards:
                  - type: custom:mushroom-entity-card
                    entity: input_boolean.buzz_home
                    icon: mdi:bullhorn
                    name: Buzz
                    tap_action:
                      action: toggle
                    icon_tap_action:
                      action: toggle
                    layout: vertical
                    card_mod: *card_style
                  - type: custom:mushroom-entity-card
                    entity: input_boolean.reset_internet
                    icon: mdi:wifi-star
                    name: Reset Net
                    tap_action:
                      action: more-info
                    icon_tap_action:
                      action: more-info
                    layout: vertical
                    card_mod: *card_style
                  - type: custom:mushroom-template-card
                    primary: UbhiNAS
                    icon: mdi:nas
                    icon_color: "{{ 'green' if is_state('sensor.ubhinas_status','good') else 'red' }}"
                    layout: vertical
                    tap_action:
                      action: more-info
                      entity: sensor.ubhinas_status
                    card_mod: *card_style
                  - type: custom:mushroom-template-card
                    primary: PlexNAS
                    icon: mdi:nas
                    icon_color: "{{ 'green' if is_state('sensor.plexnas_status','good') else 'red' }}"
                    layout: vertical
                    tap_action:
                      action: more-info
                      entity: sensor.plexnas_status
                    card_mod: *card_style

      # ════════════════════════════════════════════════════════════
      #  CHARTS ROW — Solar + Energy + Gauges
      # ════════════════════════════════════════════════════════════
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: 1fr 1fr 1fr
          grid-gap: 10px
          mediaquery:
            "(max-width: 1200px)":
              grid-template-columns: 1fr 1fr
            "(max-width: 600px)":
              grid-template-columns: 1fr
        cards:
          - type: energy-solar-graph
            title: Solar Production
            card_mod: *card_style
          - type: energy-usage-graph
            title: Home Consumption
            card_mod: *card_style
          - type: vertical-stack
            cards:
              - type: energy-grid-neutrality-gauge
                card_mod: *card_style
              - type: energy-self-sufficiency-gauge
                card_mod: *card_style

      # ════════════════════════════════════════════════════════════
      #  NETWORK + DATA — full-width info bar
      # ════════════════════════════════════════════════════════════
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: 2fr 1fr
          grid-gap: 10px
          mediaquery:
            "(max-width: 800px)":
              grid-template-columns: 1fr
        cards:
          # ── Data Usage Graph ──
          - type: custom:mini-graph-card
            name: Data Usage
            icon: mdi:wan
            entities:
              - entity: sensor.xfinity_usage
                name: Used
                show_state: true
                show_points: true
                state_adaptive_color: true
                color: '#f97316'
              - entity: sensor.data_allowance_till_date
                name: Limit
                show_state: true
                show_line: false
                show_points: false
                state_adaptive_color: true
                smoothing: true
                color: '#ef4444'
              - entity: binary_sensor.sleep_time
                show_fill: true
                show_state: false
                show_line: false
                show_legend: false
                show_points: false
                color: black
                y_axis: secondary
            cache: false
            hours_to_show: 72
            points_per_hour: 1
            aggregate_func: max
            line_width: 2
            smoothing: false
            font_size: 83
            show:
              legend: true
              extrema: false
              labels: false
              labels_secondary: false
              fill: fade
            state_map:
              - value: "off"
              - value: "on"
            card_mod: *card_style

          # ── Network Speed ──
          - type: custom:layout-card
            layout_type: custom:grid-layout
            layout:
              grid-template-columns: 1fr 1fr 1fr
              grid-gap: 8px
            cards:
              - type: custom:mushroom-template-card
                primary: "{{ states('sensor.speedtest_ping') | float(0) | round(0) }} ms"
                secondary: Ping
                icon: mdi:speedometer
                icon_color: |-
                  {% set p = states('sensor.speedtest_ping') | float(0) %}
                  {% if p < 30 %}green{% elif p < 60 %}orange{% else %}red{% endif %}
                layout: vertical
                tap_action:
                  action: more-info
                  entity: sensor.speedtest_ping
                card_mod: &speed_card
                  style: |
                    ha-card {
                      border-radius: 16px !important;
                      border: 1px solid rgba(255,255,255,0.06) !important;
                    }
                    mushroom-state-info {
                      --card-primary-font-size: 20px;
                      --card-primary-font-weight: 600;
                    }

              - type: custom:mushroom-template-card
                primary: "{{ states('sensor.speedtest_download') | float(0) | round(0) }} Mbps"
                secondary: Download
                icon: mdi:download-network
                icon_color: |-
                  {% set d = states('sensor.speedtest_download') | float(0) %}
                  {% if d > 200 %}green{% elif d > 100 %}orange{% else %}red{% endif %}
                layout: vertical
                tap_action:
                  action: more-info
                  entity: sensor.speedtest_download
                card_mod: *speed_card

              - type: custom:mushroom-template-card
                primary: "{{ states('sensor.speedtest_upload') | float(0) | round(0) }} Mbps"
                secondary: Upload
                icon: mdi:upload-network
                icon_color: |-
                  {% set u = states('sensor.speedtest_upload') | float(0) %}
                  {% if u > 20 %}green{% elif u > 10 %}orange{% else %}red{% endif %}
                layout: vertical
                tap_action:
                  action: more-info
                  entity: sensor.speedtest_upload
                card_mod: *speed_card
