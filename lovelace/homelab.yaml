title: HomeLab
icon: mdi:radioactive
panel: false
cards:

      - type: vertical-stack
        cards:

            - type: horizontal-stack
              title: HomeLab Power Status
              cards:

                - type: entity
                  icon: mdi:power-plug
                  entity: sensor.homelab_server_pdu_load
                  name: Power Consumption


            - type: horizontal-stack
              title: Platform
              cards:

                - type: button
                  icon: mdi:router-network-wireless
                  entity: switch.homelab_server_pdu_outlet_1
                  name: HomeLab Switch
                  tap_action:
                    action: toggle
                    confirmation:
                      text: "Are you sure you want to toggle the power for Homelab Network Switch?"

                - type: button
                  icon: mdi:monitor
                  entity: switch.homelab_server_pdu_outlet_5
                  name: Rack Monitor
                  tap_action:
                    action: toggle
                    confirmation:
                      text: "Are you sure you want to toggle the power for the Rack Monitor?"

            - type: horizontal-stack
              title: NAS
              cards:

                - type: button
                  icon: mdi:nas
                  entity: switch.homelab_server_pdu_outlet_7
                  name: ThorNAS
                  tap_action:
                    action: toggle
                    confirmation:
                      text: "Are you sure you want to toggle the power for ThorNAS?"

                - type: button
                  icon: mdi:nas
                  entity: switch.homelab_server_pdu_outlet_6
                  name: PlexNAS
                  tap_action:
                    action: toggle
                    confirmation:
                      text: "Are you sure you want to toggle the power for PlexNAS?"


            - type: horizontal-stack
              title: NVR
              cards:

                - type: grid
                  columns: 2
                  square: false
                  cards:

                    - type: button
                      icon: mdi:cctv
                      entity: switch.homelab_server_pdu_outlet_8
                      name: NVR
                      tap_action:
                        action: toggle
                        confirmation:
                          text: "Are you sure you want to toggle the power for the NVR?"


      - type: vertical-stack
        title: HP Titan AI
        cards:

              - type: grid
                columns: 2
                square: false
                cards:

                  - type: button
                    icon: mdi:server-outline
                    entity: switch.homelab_server_pdu_outlet_2
                    name: HP DL380 G9
                    tap_action:
                      action: toggle
                      confirmation:
                        text: "Are you sure you want to toggle the power for HPDL380G9?"

                  - type: button
                    icon: mdi:power-cycle
                    tap_action:
                      action: call-service
                      service: rest_command.hp_server_toggleonoff
                      confirmation:
                          text: "Are you sure you want to toggle the power for HPDL380G9?"

              - type: conditional
                conditions:
                  - condition: state
                    entity: switch.homelab_server_pdu_outlet_2
                    state: "on"
                card:                    
                    type: custom:mini-graph-card
                    name: HP DL380 G9
                    unit: W
                    icon: mdi:server-outline
                    hours_to_show: 1
                    points_per_hour: 60
                    update_interval: 60
                    animate: true
                    line_width: 1
                    smoothing: false
                    entities:
                      - entity: sensor.hp_ilo_power_reading
                    show:
                      graph: bar

              - type: conditional
                conditions:
                  - condition: state
                    entity: switch.homelab_server_pdu_outlet_2
                    state: "on"
                card:              
                    type: entities
                    show_header_toggle: false
                    columns: 2
                    entities:
                      - sensor.hp_ilo_power_status
                      - sensor.hp_ilo_power_reading
                      - sensor.hp_ilo_power_on_time
                      - sensor.hp_ilo_uid_status
                      - sensor.hp_ilo_health_bios_hardware
                      - sensor.hp_ilo_health_processor_status
                      - sensor.hp_ilo_health_storage_status
                      - sensor.hp_ilo_health_temperature_status
                      - sensor.hp_ilo_health_fan_status
                      - sensor.hp_ilo_health_network_status
                      - sensor.hp_ilo_health_memory_status
                      - sensor.hp_ilo_temp_inlet
                      - sensor.hp_ilo_temp_cpu1
                      - sensor.hp_ilo_temp_cpu2


      - type: vertical-stack
        title: SuperMicro 01
        cards:

          - type: grid
            columns: 2
            square: false
            cards:

              - type: button
                icon: mdi:server-outline
                entity: switch.homelab_server_pdu_outlet_3
                name: SM X10DRU-i+ 01
                tap_action:
                  action: toggle
                  confirmation:
                    text: "Are you sure you want to toggle the power for SuperMicro Server 01?"

              - type: button
                icon: mdi:power-cycle
                entity: switch.supermicro_01_server_chassis
                show_name: false
                tap_action:
                  action: toggle
                  confirmation:
                      text: "Are you sure you want to toggle the power for SuperMicro 01?"
          - type: conditional
            conditions:
              - condition: state
                entity: switch.homelab_server_pdu_outlet_3
                state: "on"
            card:
                type: entities
                show_header_toggle: false
                entities:
                  - switch.supermicro_01_server_chassis
                  - sensor.supermicro_01_state
                  - sensor.supermicro_01_cpu1_temp
                  - sensor.supermicro_01_cpu2_temp
                  - sensor.supermicro_01_system_temp
                  - sensor.supermicro_01_mb_nic_temp1
                  - sensor.supermicro_01_mb_nic_temp2
                  - sensor.supermicro_01_pch_temp
                  - sensor.supermicro_01_peripheral_temp
                  - sensor.supermicro_01_vcpu1vrm_temp
                  - sensor.supermicro_01_vcpu2vrm_temp
                  - sensor.supermicro_01_vmemabvrm_temp
                  - sensor.supermicro_01_vmemcdvrm_temp
                  - sensor.supermicro_01_vmemefvrm_temp
                  - sensor.supermicro_01_vmemghvrm_temp

          - type: vertical-stack
            title: SuperMicro 02
            cards:

              - type: grid
                columns: 2
                square: false
                cards:

                  - type: button
                    icon: mdi:server-outline
                    entity: switch.homelab_server_pdu_outlet_4
                    name: SM X10DRU-i+ 02
                    tap_action:
                      action: toggle
                      confirmation:
                        text: "Are you sure you want to toggle the power for SuperMicro Server 2?"

                  - type: button
                    icon: mdi:power-cycle
                    entity: switch.supermicro_02_server_chassis
                    show_name: false
                    tap_action:
                      action: toggle
                      confirmation:
                          text: "Are you sure you want to toggle the power for SuperMicro 02?"

              - type: conditional
                conditions:
                  - condition: state
                    entity: switch.homelab_server_pdu_outlet_4
                    state: "on"
                card:
                    type: entities
                    show_header_toggle: false
                    entities:
                      - switch.supermicro_02_server_chassis
                      - sensor.supermicro_02_state
                      - sensor.supermicro_02_cpu1_temp
                      - sensor.supermicro_02_cpu2_temp
                      - sensor.supermicro_02_system_temp
                      - sensor.supermicro_02_mb_nic_temp1
                      - sensor.supermicro_02_mb_nic_temp2
                      - sensor.supermicro_02_pch_temp
                      - sensor.supermicro_02_peripheral_temp
                      - sensor.supermicro_02_vcpu1vrm_temp
                      - sensor.supermicro_02_vcpu2vrm_temp
                      - sensor.supermicro_02_vmemabvrm_temp
                      - sensor.supermicro_02_vmemcdvrm_temp
                      - sensor.supermicro_02_vmemefvrm_temp
                      - sensor.supermicro_02_vmemghvrm_temp
