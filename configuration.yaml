recorder:
  purge_keep_days: 7
  include: !include entity_tracking.yaml

rest_command:
  hp_server_on:
    url: !secret hp_server_ilo_url
    method: POST
    headers:
      accept: "application/json"
    payload: '{"Action":"Reset","ResetType":"On"}'
    content_type:  'application/json; charset=utf-8'
    username: !secret hp_server_ilo_username
    password: !secret hp_server_ilo_password
    verify_ssl: false
  hp_server_forceoff:
    url: !secret hp_server_ilo_url
    method: POST
    headers:
      accept: "application/json"
    payload: '{"Action":"Reset","ResetType":"ForceOff"}'
    content_type:  'application/json; charset=utf-8'
    username: !secret hp_server_ilo_username
    password: !secret hp_server_ilo_password
    verify_ssl: false
  hp_server_forcerestart:
    url: !secret hp_server_ilo_url
    method: POST
    headers:
      accept: "application/json"
    payload: '{"Action":"Reset","ResetType":"ForceRestart"}'
    content_type:  'application/json; charset=utf-8'
    username: !secret hp_server_ilo_username
    password: !secret hp_server_ilo_password
    verify_ssl: false
  hp_server_gracefulrestart:
      url: !secret hp_server_ilo_url
      method: POST
      headers:
        accept: "application/json"
      payload: '{"Action":"Reset","ResetType":"GracefulRestart"}'
      content_type:  'application/json; charset=utf-8'
      username: !secret hp_server_ilo_username
      password: !secret hp_server_ilo_password
      verify_ssl: false
  hp_server_toggleonoff:
      url: !secret hp_server_ilo_url
      method: POST
      headers:
        accept: "application/json"
      payload: '{ "Action": "PowerButton", "PushType": "Press", "Target": "/Oem/Hp"}'
      content_type:  'application/json; charset=utf-8'
      username: !secret hp_server_ilo_username
      password: !secret hp_server_ilo_password
      verify_ssl: false


stream:
  ll_hls: true
  part_duration: 0.75
  segment_duration: 6

system_health:

template:
  - sensor:
    - name: Days in Current Month
      default_entity_id: sensor.month_days_in_current
      icon: mdi:calendar
      state: >-
        {% if now().month in [1,3,5,7,8,10,12] %}
          31
        {% elif now().month in [4,6,9,11] %}
          30
        {% elif now().month == 2 and ((now().year-2000) % 4 > 0) %} 
          28
        {% elif now().month == 2 and ((now().year-2000) % 4 == 0) %} 
          29
        {% endif %}

    - name: Curreny Day in Month
      default_entity_id: sensor.month_current_day
      icon: mdi:calendar
      state: "{{ now().day }}"

    - name: Percentage Through Month
      default_entity_id: sensor.month_percent
      icon: mdi:calendar
      state: "{{ ((states('sensor.month_current_day')|float / states('sensor.month_days_in_current')|float) * 100) | round(0) }}"

    - name: Data Allowance Till Date
      default_entity_id: sensor.data_allowance_till_date
      icon: mdi:search-web
      unit_of_measurement: GB
      state: >-
        {% if now().month in [1,3,5,7,8,10,12] %}
          {{ ((1229 / 31) * now().day) | int }}
        {% elif now().month in [4,6,9,11] %}
          {{ ((1229 / 30) * now().day) | int }}
        {% elif now().month == 2 and ((now().year-2000) % 4 > 0) %}
          {{ ((1229 / 28) * now().day) | int }}
        {% elif now().month == 2 and ((now().year-2000) % 4 == 0) %}
          {{ ((1229 / 29) * now().day) | int }}
        {% endif %}

    - name: Solar Power
      default_entity_id: sensor.solar_power
      unit_of_measurement: kW
      state: "{{ states('sensor.home_energy_gateway_solar_power') | float | abs | round(1) }}"
      
    - name: Grid Power
      default_entity_id: sensor.grid_power
      unit_of_measurement: kW
      state: >-
        {% if states('sensor.home_energy_gateway_site_power') | float | abs == 0 %}
          0
        {% else %}
          {{ states('sensor.home_energy_gateway_site_power') | float | abs | round(1) }}
        {% endif %}
    
    - name: Grid Power Target
      default_entity_id: sensor.grid_power_target
      unit_of_measurement: kW
      state: "{{ states('sensor.home_energy_gateway_site_power') | float | abs | round(1) }}"
      
    - name: Powerwall Power
      default_entity_id: sensor.powerwall_power
      unit_of_measurement: kW
      state: >-
        {% if states('sensor.home_energy_gateway_battery_power') | float | abs == 0 %}
          0
        {% else %}
          {{ states('sensor.home_energy_gateway_battery_power') | float | abs | round(1) }}
        {% endif %}
    
    - name: Powerwall Power Target
      default_entity_id: sensor.powerwall_power_target
      unit_of_measurement: kW
      state: "{{ states('sensor.home_energy_gateway_charge') | float / 12.5 | round(1) }}"
    
    - name: Powerwall Charge Percentage
      default_entity_id: sensor.powerwall_power_name
      state: "{{ states('sensor.home_energy_gateway_charge') }}%"
      
    - name: House Load
      default_entity_id: sensor.house_load
      unit_of_measurement: kW
      state: "{{ states('sensor.home_energy_gateway_load_power') | float | abs | round(1) }}"

    - name: Thermostat Living Room Temperature
      default_entity_id: sensor.thermostat_living_room_temperature
      unit_of_measurement: °F
      state: "{{ state_attr('climate.thermostat_living_room', 'current_temperature') | float(0) }}"

    - name: Thermostat Master Bedroom Temperature
      default_entity_id: sensor.thermostat_master_bedroom_temperature
      unit_of_measurement: °F
      state: "{{ state_attr('climate.thermostat_master_bedroom', 'current_temperature') | float(0) }}"

    - name: Thermostat Entertainment Room Temperature
      default_entity_id: sensor.thermostat_entertainment_room_temperature
      unit_of_measurement: °F
      state: "{{ state_attr('climate.thermostat_entertainment_room', 'current_temperature') | float(0) }}"

    - name: Thermostat Upper Guest Bedroom Temperature
      default_entity_id: sensor.thermostat_upper_guest_bedroom_temperature
      unit_of_measurement: °F
      state: "{{ state_attr('climate.thermostat_upper_guest_bedroom', 'current_temperature') | float(0) }}"

    - name: Thermostat Upper Small Bedroom Temperature
      default_entity_id: sensor.thermostat_upper_small_bedroom_temperature
      unit_of_measurement: °F
      state: "{{ state_attr('climate.thermostat_upper_small_bedroom', 'current_temperature') | float(0) }}"

    - name: Thermostat Upper Big Bedroom Temperature
      default_entity_id: sensor.thermostat_upper_big_bedroom_temperature
      unit_of_measurement: °F
      state: "{{ state_attr('climate.thermostat_upper_big_bedroom', 'current_temperature') | float(0) }}"

